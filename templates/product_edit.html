{% extends 'base.html' %}{% block content %}<main class="admin-wrap"><a class="preview-btn" style="color:#087a58;border-color:#087a58" href="{{ url_for('admin') }}">← Back to Dashboard</a><section class="admin-panel" style="margin-top:18px"><div class="panel-title"><span>EDIT</span><div><h3>Edit Product / Raw Material</h3><p>Update the information shown on your website.</p></div></div><form action="{{ url_for('save_product') }}" method="post" enctype="multipart/form-data"><input type="hidden" name="id" value="{{ item.id }}"><div class="form-row"><div><label>Category</label><select name="category">{% for option in ['Hydraulic Paper Plate Machine','Paper Cup Machine','Automatic Agarbatti Machine','Paper Plate Raw Material','Paper Cup Raw Material','Agarbatti Raw Material'] %}<option {{ 'selected' if item.category==option }}>{{ option }}</option>{% endfor %}</select></div><div><label>Price</label><input name="price" value="{{ item.price }}"></div></div><label>Product Name</label><input name="name_en" value="{{ tr(item.name,'en') }}" required><label>Description</label><textarea name="description_en" rows="3">{{ tr(item.description,'en') }}</textarea><label>Specifications</label><input name="specifications_en" value="{{ tr(item.specifications,'en') }}"><div class="form-row"><div><label>Offer</label><input name="offer" value="{{ item.offer }}"></div><div><label>Video URL</label><input name="video" type="url" value="{{ item.video }}"></div></div><label>Replace Product / Raw Material Photo (optional)</label><input type="file" name="image" accept="image/*"><label class="check-label"><input type="checkbox" name="active" {{ 'checked' if item.active }}> Show this product on website</label><button class="btn" type="submit">Save Changes</button></form></section></main>{% endblock %}
