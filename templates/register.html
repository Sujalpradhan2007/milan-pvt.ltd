{% extends 'base.html' %}{% block content %}<section class="section" style="max-width:520px"><div class="form register-card"><div class="eyebrow">Admin access</div><h1>Create Account</h1><p>Create your secure admin account, then sign in to manage the website.</p><form method="post"><label>Username</label><input name="username" required minlength="3" autofocus><label>Password</label><input type="password" name="password" required minlength="8"><label>Confirm password</label><input type="password" name="confirm_password" required minlength="8"><button class="btn" type="submit">Create account</button></form><p style="font-size:.9rem">Already have an account? <a style="color:#087a58;font-weight:700" href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
